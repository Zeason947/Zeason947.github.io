---
layout: default
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeason947 的小站</title>
    <style>
        /* 整体布局放大 */
        html {
            font-size: 1.1rem; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            color: #222;
            background: #fff;
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* 顶部标题区 */
        .header-wrapper {
            max-width: 1100px;
            margin: 30px auto 0; /* 贴近顶部 */
            padding: 0 40px;
        }

        .site-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
        }

        /* 贯穿边缘的横线 */
        .top-line {
            height: 1px;
            background-color: #eee;
            width: 100vw;
            position: relative;
            left: 50%;
            margin-left: -50vw;
        }

        /* 双栏布局容器 */
        .container {
            display: flex;
            max-width: 1100px;
            margin: 40px auto; 
            padding: 0 40px;
            gap: 100px;
        }

        /* 左侧信息栏 */
        aside {
            flex: 0 0 200px;
        }

        .author-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0 0 10px 0;
        }

        .bio {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 25px;
        }

        .social-links {
            list-style: none;
            padding: 0;
            font-size: 0.95rem;
        }

        .social-links li {
            margin-bottom: 10px;
        }

        .social-links a {
            color: #444;
            text-decoration: none;
        }

        .social-links a:hover {
            text-decoration: underline;
        }

        /* 右侧内容区 */
        main {
            flex: 1;
        }

        .welcome {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 1.6rem;
            font-weight: bold;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 35px;
        }

        /* 博客条目间隔 */
        article {
            margin-bottom: 60px;
        }

        article h2 {
            font-size: 1.4rem;
            margin: 0 0 10px 0;
        }

        article h2 a {
            color: #000;
            text-decoration: none;
        }

        article h2 a:hover {
            color: #0076df;
        }

        .excerpt {
            font-size: 1.05rem;
            color: #555;
        }

        @media (max-width: 768px) {
            .header-wrapper, .container { padding: 0 25px; }
            .container { flex-direction: column; gap: 40px; margin-top: 30px; }
            aside { flex: none; width: 100%; }
        }
    </style>
</head>
<body>

    <header class="header-wrapper">
        <span class="site-title">Zeason947 的小站</span>
        <div class="top-line"></div>
    </header>

    <div class="container">
        <aside>
            <h2 class="author-name">Zeason947</h2>
            <p class="bio">啥都折腾一点的普通人，喜欢上网冲浪。</p>
            <ul class="social-links">
                <li><a href="https://github.com/Zeason947" target="_blank">GitHub</a></li>
                <li><a href="#" target="_blank">Bilibili</a></li>
            </ul>
        </aside>

        <main>
            <div class="welcome">👋 欢迎来到 Zeason947 的小站！</div>
            
            <div class="section-title">文章</div>

            {% for post in site.posts %}
            <article>
                <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
                <p class="excerpt">{{ post.excerpt | strip_html | truncate: 100 }}</p>
            </article>
            {% endfor %}
            </main>
    </div>

</body>
</html>
