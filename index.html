---
layout: compress
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeason947 的小站</title>
    <style>
        html { font-size: 1.1rem; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; color: #222; background: #fff; line-height: 1.7; overflow-x: hidden; }
        .header-wrapper { max-width: 1100px; margin: 30px auto 0; padding: 0 40px; }
        .site-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; display: block; text-decoration: none; color: #000; }
        .top-line { height: 1px; background-color: #eee; width: 100vw; position: relative; left: 50%; margin-left: -50vw; }
        .container { display: flex; max-width: 1100px; margin: 40px auto; padding: 0 40px; gap: 100px; }
        aside { flex: 0 0 200px; }
        .author-name { font-size: 1.4rem; font-weight: bold; margin: 0 0 10px 0; }
        .bio { font-size: 0.95rem; color: #666; margin-bottom: 25px; }
        .social-links { list-style: none; padding: 0; font-size: 0.95rem; }
        .social-links li { margin-bottom: 10px; }
        .social-links a { color: #444; text-decoration: none; }
        .social-links a:hover { text-decoration: underline; }
        main { flex: 1; }
        .welcome { font-size: 1.6rem; font-weight: bold; margin-bottom: 25px; }
        .section-title { font-size: 1.6rem; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 35px; }
        
        /* 文章列表样式微调 */
        article { margin-bottom: 60px; }
        article h2 { font-size: 1.4rem; margin: 0 0 10px 0; }
        article h2 a { color: #000; text-decoration: none; }
        article h2 a:hover { color: #0076df; }
        .excerpt { font-size: 1.05rem; color: #555; margin: 10px 0 0 0; }
        .post-date { font-size: 0.85rem; color: #bbb; margin-top: 12px; }

        @media (max-width: 768px) { .header-wrapper, .container { padding: 0 25px; } .container { flex-direction: column; gap: 40px; margin-top: 30px; } aside { flex: none; width: 100%; } }
    </style>
</head>
<body>

    <header class="header-wrapper">
        <a href="/" class="site-title">Zeason947 的小站</a>
        <div class="top-line"></div>
    </header>

    <div class="container">
        <aside>
            <h2 class="author-name">Zeason947</h2>
            <p class="bio">啥都折腾一点的普通人，喜欢上网冲浪。</p>
            <ul class="social-links">
                <li><a href="https://github.com/Zeason947" target="_blank">GitHub</a></li>
                <li><a href="#" target="_blank">Bilibili</a></li>
            </ul>
        </aside>

        <main>
            <div class="welcome">👋 欢迎来到 Zeason947 的小站！</div>
            <div class="section-title">文章</div>

            {% for post in site.posts %}
            <article>
                <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
                <p class="excerpt">{{ post.excerpt | strip_html | truncate: 120 }}</p>
                <div class="post-date">{{ post.date | date: "%Y-%m-%d" }}</div>
            </article>
            {% endfor %}

        </main>
    </div>

</body>
</html>
