<!DOCTYPE html>
<html lang="zh-CN">
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - Zeason947 的小站</title>
    <style>
        /* 保持与首页一致的基础样式 */
        html { font-size: 1.1rem; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; color: #222; background: #fff; line-height: 1.8; overflow-x: hidden; }
        .header-wrapper { max-width: 1100px; margin: 30px auto 0; padding: 0 40px; }
        .site-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; display: block; text-decoration: none; color: #000; }
        .top-line { height: 1px; background-color: #eee; width: 100vw; position: relative; left: 50%; margin-left: -50vw; }
        .container { display: flex; max-width: 1100px; margin: 40px auto; padding: 0 40px; gap: 100px; }
        
        aside { flex: 0 0 200px; }
        .post-meta { list-style: none; padding: 0; margin: 0; font-size: 0.9rem; color: #888; }
        .post-meta li { margin-bottom: 12px; }
        .back-link { display: inline-block; margin-top: 30px; text-decoration: none; color: #444; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }

        main { flex: 1; max-width: 750px; }
        .post-header h1 { font-size: 2.2rem; font-weight: bold; margin: 0 0 40px 0; line-height: 1.3; }

        /* 文章正文内排版强化 */
        .post-content p { margin-bottom: 1.6rem; }
        .post-content h2 { font-size: 1.5rem; margin: 3rem 0 1.2rem 0; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .post-content ul { margin-bottom: 1.6rem; padding-left: 1.5rem; }
        .post-content li { margin-bottom: 0.5rem; }
        .post-content strong { color: #000; }

        @media (max-width: 768px) { .header-wrapper, .container { padding: 0 25px; } .container { flex-direction: column; gap: 40px; } aside { border-bottom: 1px solid #eee; padding-bottom: 20px; } }
    </style>
</head>
<body>
    <header class="header-wrapper">
        <a href="/" class="site-title">Zeason947 的小站</a>
        <div class="top-line"></div>
    </header>

    <div class="container">
        <aside>
            <ul class="post-meta">
                <li>发布于：{{ page.date | date: "%Y-%m-%d %H:%M" }}</li>
                <li>分类：{{ page.categories | join: ", " }}</li>
                <li>阅读：约 {{ content | strip_html | strip_newlines | size | divided_by: 300 | plus: 1 }} 分钟</li>
            </ul>
            <a href="/" class="back-link">← 返回首页</a>
        </aside>

        <main>
            <header class="post-header">
                <h1>{{ page.title }}</h1>
            </header>
            <article class="post-content">
                {{ content }} </article>
        </main>
    </div>
</body>
</html>
