---
layout: compress
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeason947 的小站</title>

<style>
/* 千禧年风格核心：渐变 + 霓虹 + 盒子边框 */

html {
    font-size: 16px;
}

body {
    margin: 0;
    padding: 0;
    font-family: "Tahoma", "Verdana", "Microsoft YaHei", sans-serif;
    background: linear-gradient(to bottom, #000428, #004e92);
    color: #ffffff;
}

/* 外层布局 */
.wrapper {
    width: 1000px;
    margin: 30px auto;
    background: #111;
    border: 3px solid #00ffff;
    box-shadow: 0 0 15px #00ffff;
}

/* 头部 */
.header {
    padding: 25px;
    background: linear-gradient(to right, #ff00cc, #333399);
    border-bottom: 2px solid #00ffff;
    text-align: center;
}

.site-title {
    font-size: 32px;
    font-weight: bold;
    color: #ffffff;
    text-decoration: none;
    text-shadow: 0 0 10px #ff00ff;
}

/* 主体 */
.content {
    display: flex;
}

/* 侧边栏 */
aside {
    width: 250px;
    padding: 20px;
    background: #1a1a1a;
    border-right: 2px solid #00ffff;
}

.author-name {
    font-size: 20px;
    color: #00ffff;
    margin-bottom: 10px;
}

.bio {
    font-size: 14px;
    color: #cccccc;
    margin-bottom: 20px;
}

.social-links {
    list-style: square;
    padding-left: 20px;
}

.social-links a {
    color: #ff66ff;
    text-decoration: none;
}

.social-links a:hover {
    color: #00ffff;
}

/* 主内容区 */
main {
    flex: 1;
    padding: 30px;
}

.welcome {
    font-size: 22px;
    margin-bottom: 30px;
    color: #00ffff;
    text-shadow: 0 0 6px #00ffff;
}

.section-title {
    font-size: 20px;
    border-bottom: 2px dashed #ff00ff;
    padding-bottom: 10px;
    margin-bottom: 25px;
}

/* 文章列表 */
article {
    margin-bottom: 40px;
    padding: 15px;
    background: #1f1f1f;
    border: 2px solid #444;
}

article:hover {
    border-color: #00ffff;
    box-shadow: 0 0 10px #00ffff;
}

article h2 {
    margin: 0 0 10px 0;
    font-size: 18px;
}

article h2 a {
    color: #ffcc00;
    text-decoration: none;
}

article h2 a:hover {
    color: #ffffff;
    text-shadow: 0 0 6px #ffcc00;
}

.excerpt {
    font-size: 14px;
    color: #cccccc;
}

.post-date {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
}

/* 响应式 */
@media (max-width: 1024px) {
    .wrapper {
        width: 95%;
    }
}

@media (max-width: 768px) {
    .content {
        flex-direction: column;
    }
    aside {
        width: auto;
        border-right: none;
        border-bottom: 2px solid #00ffff;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="header">
        <a href="/" class="site-title">Zeason947 的小站</a>
    </div>

    <div class="content">

        <aside>
            <div class="author-name">Zeason947</div>
            <div class="bio">啥都折腾一点的普通人，喜欢上网冲浪。</div>
            <div>联系方式</div>
            <ul class="social-links">
                <li><a href="https://github.com/Zeason947" target="_blank">GitHub</a></li>
                <li><a href="https://space.bilibili.com/3546379144137503" target="_blank">Bilibili</a></li>
            </ul>
        </aside>

        <main>

            <div class="welcome">欢迎来到 Zeason947 的小站</div>
            <div class="section-title">文章列表</div>

            {% for post in site.posts %}
            <article>
                <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
                <p class="excerpt">
                    {{ post.excerpt | strip_html | truncate: 120 }}
                </p>
                <div class="post-date">
                    {{ post.date | date: "%Y-%m-%d" }}
                </div>
            </article>
            {% endfor %}

        </main>

    </div>

</div>

</body>
</html>
